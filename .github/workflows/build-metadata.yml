name: Build metadata

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate metadata.json
        run: python3 tools/build_metadata.py

      - name: Commit metadata updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Macros/metadata.json; then
            echo "metadata.json guncel, commit gerekmiyor"
          else
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/beyhano/ClassicAssist-Macros.git"
            git add Macros/metadata.json
            git commit -m "chore: metadata.json otomatik guncellendi"
            git push origin main
          fi